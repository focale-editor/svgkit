name: svgkit
description: Pure Dart SVG and SVGZ editing with paths, transforms, styles, resources, immutable snapshots, and bounded codecs.
version: 0.1.0
homepage: https://github.com/focale-editor/svgkit
repository: https://github.com/focale-editor/svgkit

topics:
  - svg
  - vector-graphics
  - codec
  - file-format

screenshots:
  - description: 'Editable SVG artwork with a Bezier curve and anchor points.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  xml: '>=7.0.0 <8.0.0'
  zcodec: '>=0.2.5 <0.3.0'

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 SvgKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
