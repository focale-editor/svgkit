<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="paint"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
    <clipPath id="clip"><rect width="90" height="50" rx="8"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="0"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="green"/></marker>
  </defs>
  <style>#panel { stroke: black; stroke-width: 2; } #curve { fill:none;stroke:green;stroke-width:2 }</style>
  <g id="art" transform="translate(10 10)">
    <rect id="panel" width="70" height="40" fill="url(#paint)" clip-path="url(#clip)" filter="url(#blur)"/>
    <text id="caption" x="0" y="70" font-size="14">Before <tspan id="word" font-weight="bold">world</tspan>!</text>
    <path id="curve" d="m0 95 q20 -30 40 0 t40 0 a20 10 0 0 1 40 0" marker-end="url(#arrow)"/>
  </g>
  <use id="copy" xlink:href="#panel" x="130" y="10"/>
</svg>
